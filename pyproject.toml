[project]
name = "foundry-pattern-library"
version = "0.1.0"
description = "Microsoft Foundry Patterns — runnable patterns for building, governing and operating agents, told through a Private Banking scenario."
readme = "README.md"
# Pinned below 3.14: several Azure SDK deps have no 3.14 wheels yet.
requires-python = ">=3.12,<3.14"
dependencies = [
    # Core Foundry / agents (including Patterns 13-15)
    "azure-ai-projects>=2.3.0",
    "azure-ai-agents>=1.1.0",
    "azure-identity>=1.19.0",
    # Evaluations and release gates (Patterns 7, 14 + 15)
    "azure-ai-evaluation>=1.0.0",
    # Observability (Pattern 6)
    "azure-monitor-opentelemetry>=1.6.0",
    "opentelemetry-sdk>=1.27.0",
    # Agent orchestration + graph workflows (Patterns 5A + 5B)
    "agent-framework>=1.10.0",
    # OpenAI-compatible calls (Pattern 1 gateway client)
    "openai>=1.40.0",
    # MCP interop and approval service (Patterns 3, 9, 12 + 13)
    "mcp>=1.2.0",
    # Utility
    "python-dotenv>=1.0.0",
    # ARM/stable-endpoint calls and remote approval audit (Patterns 13-15)
    "requests>=2.31.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "python-pptx>=1.0.2",
]
