# Pattern 7 — the quality gate. Drop into .github/workflows/.
# Every PR that touches prompts/agents gets scored; a groundedness regression
# blocks the merge. This is what a gateway + DIY factory cannot give them.
name: agent-eval-gate

on:
  pull_request:
    paths:
      - "agents/**"
      - "prompts/**"
      - "07-evaluations/**"

permissions:
  id-token: write   # OIDC federated login to Azure — no stored secrets
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - run: uv sync
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Run evaluation gate
        env:
          AZURE_AI_ENDPOINT: ${{ secrets.AZURE_AI_ENDPOINT }}
          AZURE_AI_KEY: ${{ secrets.AZURE_AI_KEY }}
          MODEL_DEPLOYMENT_NAME: gpt-5.4-mini
          EVAL_GROUNDEDNESS_MIN: "4.0"
        run: uv run python 07-evaluations/run_eval.py   # non-zero exit fails the check
