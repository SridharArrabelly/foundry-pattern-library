# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
    extensions:
        azure.ai.agents: '>=1.0.0-beta.4'
name: multi-agent-orchestrator-hosted
services:
    ai-project:
        host: azure.ai.project
        endpoint: https://your-foundry-resource.services.ai.azure.com/api/projects/your-project
    multi-agent-orchestrator-hosted:
        project: ./src/multi-agent-orchestrator
        host: azure.ai.agent
        language: python
        uses:
            - ai-project
        env:
            AZURE_AI_MODEL_DEPLOYMENT_NAME: gpt-5.4-mini
        codeConfiguration:
            dependencyResolution: remote_build
            entryPoint: main.py
            runtime: python_3_13
        container:
            resources:
                cpu: "0.5"
                memory: 1Gi
        kind: hosted
        name: multi-agent-orchestrator-hosted
        protocols:
            - protocol: responses
              version: 2.0.0
infra:
    provider: microsoft.foundry
